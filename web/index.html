<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jotta Text Web</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <main>
    <!-- Shown while loading, on startup failure and for storage warnings; the
         editor's own menu bar has every file, preview and settings action. -->
    <div id="status" role="status">Loading Jotta Text…</div>
    <canvas id="canvas" tabindex="0" aria-label="Jotta Text code editor" oncontextmenu="event.preventDefault()"></canvas>
    <section id="preview-panel" hidden aria-label="Live preview">
      <div><strong>Live preview</strong><button id="close-preview" aria-label="Close preview">×</button></div>
      <iframe id="preview-frame" title="Document preview" sandbox="allow-scripts allow-modals"></iframe>
    </section>
  </main>
  <input type="file" id="file-picker" hidden multiple>
  <input type="file" id="folder-picker" hidden multiple webkitdirectory>
  <dialog id="save-dialog">
    <form method="dialog"><h2>Download file</h2><label>Filename<input name="filename" required autocomplete="off"></label>
    <p>Your workspace copy stays in this browser. The download saves a separate copy to your device.</p>
    <div><button value="cancel" formnovalidate>Cancel</button><button value="save">Download</button></div></form>
  </dialog>
  <script>
    // Report startup failures instead of leaving the page on "Loading".
    function jottaStartupFailed(message) {
      if (globalThis.JottaBrowserReady) return;
      const status = document.getElementById('status');
      status.textContent = message;
      status.hidden = false;
    }
    addEventListener('error', event => {
      if (event instanceof ErrorEvent) jottaStartupFailed('Jotta Text could not start: ' + event.message);
    });
  </script>
  <script type="module" src="app.mjs"
    onerror="jottaStartupFailed('Jotta Text could not load its files. Extract the whole ZIP to a folder and serve that folder over HTTP; see README.md.')"></script>
</body>
</html>
